<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH Vapeshop - Log in</title>

  <!-- Fonts: Rajdhani (heading) and Inter (everything else) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- LEFT SIDE: big logo -->
    <section class="brand">
      <img class="brand__logo" src="images/logo-large.png" alt="TH Vapeshop logo">
      <p class="brand__name">TH VAPESHOP</p>
    </section>

    <!-- RIGHT SIDE: login form -->
    <section class="login">
      <div class="login__box">
        <img class="login__icon" src="images/logo-small.png" alt="TH logo">
        <h1 class="login__title">Log in to your account</h1>
        <p class="login__subtitle">Welcome back! Please enter your details.</p>

        <form class="form" action="dashboard.html" method="get">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" id="email" name="email" placeholder="Enter your email">

          <label class="form__label" for="password">Password</label>
          <input class="form__input" type="password" id="password" name="password" value="password">

          <div class="form__options">
            <label class="remember">
              <input type="checkbox" name="remember">
              <span>Remember for 30 days</span>
            </label>
            <a class="forgot" href="#">Forgot password</a>
          </div>

          <button class="btn" type="submit">Sign in</button>
        </form>
      </div>
    </section>

  </main>
</body>
</html>
