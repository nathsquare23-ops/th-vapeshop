
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Vape Shop | View All Orders</title>
    <link rel="stylesheet" href="../css/sales-management-view-all-orders.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=Nunito:wght@500;600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/fit-screen.js" defer></script>
<script src="../js/app.js" defer></script>
</head>
<body>

<div class="app-container">

    <!-- SIDEBAR -->
    

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP BAR -->
        

        <!-- PAGE CONTENT -->
        <section class="page-content">

            <div class="breadcrumb">
                <span>sales management</span>
                <span class="breadcrumb-arrow">›</span>
                <span>view all orders</span>
            </div>

            <!-- FILTER SECTION -->
            <div class="filter-section">

                <button class="back-button" onclick="goBack()">
                    Go back
                </button>

                <div class="category-tabs">
                    <button class="category-tab active" data-filter="all">
                        All
                    </button>

                    <button class="category-tab" data-filter="in-process">
                        In-Process
                    </button>

                    <button class="category-tab" data-filter="completed">
                        Completed
                    </button>
                </div>

            </div>

            <!-- ORDERS GRID -->
            <div class="orders-grid" id="ordersGrid">

                <!-- Orders are generated through JavaScript -->

            </div>

        </section>

    </main>

</div>

<script src="../js/sales-management-view-all-orders.js"></script>

</body>
</html>
