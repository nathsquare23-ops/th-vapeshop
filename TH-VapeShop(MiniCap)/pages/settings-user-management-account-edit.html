
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account | TH Vapeshop</title>
    <link rel="stylesheet" href="../css/settings-user-management-account-edit.css">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/fit-screen.js" defer></script>
<script src="../js/app.js" defer></script>
</head>
<body>

    

    <main class="main-content">

        

        <section class="page-content">

            <a href="../pages/settings-user-management.html" class="back-button">
                <span>←</span>
                Go back
            </a>

            <section class="account-card">

                <div class="card-top-border"></div>

                <div class="account-header">
                    <img
                        src="../assets/avatar.jpg"
                        alt="Account Profile Picture"
                        class="account-avatar"
                    >

                    <div class="account-heading">
                        <h2 id="accountDisplayName">Natalie M. Perello</h2>
                        <p id="accountDisplayEmail">NatPerello@gmail.com</p>
                    </div>
                </div>

                <form id="accountForm">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Your First Name"
                                value="Natalie M. Perello"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="username">Username</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter Username"
                                value="NatPerello"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Your Email Address"
                                value="NatPerello@gmail.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="oldPassword">Old Password</label>
                            <input
                                type="password"
                                id="oldPassword"
                                name="oldPassword"
                                placeholder="Enter Old Password"
                                autocomplete="current-password"
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Your Phone Number"
                            >
                        </div>

                        <div class="form-group">
                            <label for="newPassword">New Password*</label>
                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="Enter New Password"
                                autocomplete="new-password"
                            >
                        </div>

                        <div class="form-group">
                            <label for="address">Address</label>
                            <input
                                type="text"
                                id="address"
                                name="address"
                                placeholder="Your Address"
                            >
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password*</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm New Password"
                                autocomplete="new-password"
                            >
                        </div>

                    </div>

                    <div class="form-footer">
                        <button type="submit" class="save-button">
                            Save Changes
                        </button>
                    </div>

                </form>

                <div class="card-bottom-border"></div>

            </section>

        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="../js/settings-user-management-account-edit.js"></script>
</body>
</html>
