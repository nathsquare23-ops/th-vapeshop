
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management | TH Vapeshop</title>
    <link rel="stylesheet" href="../css/sales-management.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/fit-screen.js" defer></script>
<script src="../js/app.js" defer></script>
</head>
<body>

    

    

    <main class="main-content">

        <section class="left-column">

            <section class="summary-section">
                <div class="section-heading">
                    <h1>Today's Orders | September 11, 2001</h1>
                    <p>Orders Summary</p>
                </div>

                <div class="summary-cards">
                    <div class="summary-card">
                        <h2 id="totalOrders">10</h2>
                        <p>Total Orders</p>
                    </div>

                    <div class="summary-card">
                        <h2 id="completedOrders">7</h2>
                        <p>Completed Orders</p>
                    </div>

                    <div class="summary-card">
                        <h2 id="totalItemsSold">24</h2>
                        <p>Total Items Sold</p>
                    </div>
                </div>
            </section>

            <div class="order-button-row">
                <button class="new-order-button" id="newOrderButton" type="button">
                    <span>New Order</span>
                    <span class="plus-icon" aria-hidden="true">+</span>
                </button>

                <button class="view-all-orders-button" id="viewAllOrdersButton" type="button">
                    View All Orders
                </button>
            </div>

            <section class="recent-orders-section" id="recentOrdersSection">
                <div class="panel-heading">
                    <h2>Recent Orders</h2>

                    <div class="panel-actions">
                        <button class="outline-button" id="viewAllButton" type="button">
                            View All
                        </button>

                        <button class="outline-button sort-button" id="sortButton" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5h16M7 12h10m-7 7h4" />
                            </svg>
                            Sort
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Qty</th>
                                <th>Status</th>
                                <th>Order Date and Time</th>
                            </tr>
                        </thead>

                        <tbody id="recentOrdersTable">
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <span id="tableCount">Showing recent orders</span>
                    <button class="text-button" id="showAllOrdersButton" type="button">
                        Show all orders
                    </button>
                </div>
            </section>

        </section>

        <section class="right-column">

            <div class="latest-heading">
                <h2>Latest Orders</h2>
            </div>

            <div class="order-cards-grid" id="orderCardsGrid">
            </div>

        </section>

    </main>

    <!-- Order Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2 id="modalTitle">New Order</h2>
                    <p>Enter the order information below.</p>
                </div>

                <button class="close-modal" id="closeModalButton" type="button">
                    &times;
                </button>
            </div>

            <form id="orderForm">
                <input type="hidden" id="orderId">

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productQuantity">Quantity</label>
                        <input
                            type="number"
                            id="productQuantity"
                            min="1"
                            value="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Unit Price (₱)</label>
                        <input
                            type="number"
                            id="productPrice"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod" required>
                        <option value="Cash">Cash</option>
                        <option value="GCash">GCash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button class="cancel-button" id="cancelModalButton" type="button">
                        Cancel
                    </button>

                    <button class="save-button" type="submit">
                        Save Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal details-modal">
            <div class="modal-header">
                <div>
                    <h2>Order Details</h2>
                    <p>Transaction information</p>
                </div>

                <button class="close-modal" id="closeDetailsButton" type="button">
                    &times;
                </button>
            </div>

            <div id="orderDetailsContent"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/sales-management.js"></script>
</body>
</html>
