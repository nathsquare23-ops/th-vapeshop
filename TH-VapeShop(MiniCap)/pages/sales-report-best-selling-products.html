
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report | Best Selling Products</title>
    <link rel="stylesheet" href="../css/sales-report-best-selling-products.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/fit-screen.js" defer></script>
<script src="../js/app.js" defer></script>
</head>
<body>

    

    

    <main class="main-content">
        <a href="../pages/sales-report.html" class="back-button">Go back</a>

        <section class="products-container">
            <div class="products-header">
                <h1>Best Selling Products</h1>

                <div class="header-actions">
                    <select id="filterSelect" class="filter-select">
                        <option value="all">Filter By</option>
                        <option value="in-stock">In Stock</option>
                        <option value="out-of-stock">Out of Stock</option>
                        <option value="restock">Restock</option>
                    </select>

                    <select id="sortSelect" class="sort-select">
                        <option value="relevance">Sort By: Relevance</option>
                        <option value="sales-high">Total Sales: High to Low</option>
                        <option value="sales-low">Total Sales: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="name">Product Name: A to Z</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>IMAGE</th>
                            <th>PRODUCT NAME</th>
                            <th>PRICE</th>
                            <th>TOTAL SALES</th>
                            <th>STOCK</th>
                            <th>STATUS</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="productsTableBody">
                        <tr data-name="Vape vape vape vape vape"
                            data-price="4099"
                            data-sales="48"
                            data-stock="25"
                            data-status="in-stock">
                            <td>
                                <div class="product-image-placeholder">TH</div>
                            </td>
                            <td class="product-name">Vape vape vape vape vape</td>
                            <td>₱4,099</td>
                            <td>48</td>
                            <td>25</td>
                            <td><span class="status in-stock">In Stock</span></td>
                            <td><button class="more-button" aria-label="More options">•••</button></td>
                        </tr>

                        <tr data-name="Vape vape vape vape vape"
                            data-price="10000"
                            data-sales="76"
                            data-stock="0"
                            data-status="out-of-stock">
                            <td>
                                <div class="product-image-placeholder">TH</div>
                            </td>
                            <td class="product-name">Vape vape vape vape vape</td>
                            <td>₱10,000</td>
                            <td>76</td>
                            <td>0</td>
                            <td><span class="status out-of-stock">Out of Stock</span></td>
                            <td><button class="more-button" aria-label="More options">•••</button></td>
                        </tr>

                        <tr data-name="Vape vape vape vape vape"
                            data-price="17500"
                            data-sales="32"
                            data-stock="3"
                            data-status="restock">
                            <td>
                                <div class="product-image-placeholder">TH</div>
                            </td>
                            <td class="product-name">Vape vape vape vape vape</td>
                            <td>₱17,500</td>
                            <td>32</td>
                            <td>3</td>
                            <td><span class="status restock">Restock</span></td>
                            <td><button class="more-button" aria-label="More options">•••</button></td>
                        </tr>
                    </tbody>
                </table>

                <div id="emptyMessage" class="empty-message" hidden>
                    No products found for this filter.
                </div>
            </div>
        </section>

        <div class="pagination">
            <button class="pagination-button" id="previousButton">Previous</button>

            <span class="page-indicator">
                Page <strong id="currentPage">1</strong> of
                <strong id="totalPages">10</strong>
            </span>

            <button class="pagination-button" id="nextButton">Next</button>
        </div>
    </main>

    <script src="../js/sales-report-best-selling-products.js"></script>
</body>
</html>
